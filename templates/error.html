{% extends "base.html" %}
{% block title %}{{ status_code }}{% endblock %}

{% block content %}
<section class="panel error-panel" aria-labelledby="error-title">
  <p class="error-code">{{ status_code }}</p>
  <h1 id="error-title">{% if status_code == 404 %}页面不存在{% elif status_code == 403 %}操作未通过校验{% else %}请求未能完成{% endif %}</h1>
  <p>{{ message }}</p>
  <div class="button-row">
    <a class="button button-primary" href="/apply">返回申请页</a>
    <a class="button button-secondary" href="/login">登录页</a>
  </div>
</section>
{% endblock %}
